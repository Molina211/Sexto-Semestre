  <div style="max-width:900px;margin:2rem auto;font-family:Arial,Helvetica,sans-serif;">
    <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h1>{{ title }}</h1>
      <div>
        <button (click)="apagarAlarma()" style="margin-right:.5rem;padding:.5rem 1rem;">Apagar alarma</button>
        <button (click)="load()" style="padding:.4rem .8rem;">Refrescar</button>
      </div>
    </header>

    <div *ngIf="message" style="margin-bottom:1rem;color:#b00;">{{ message }}</div>
    <div *ngIf="loading">Cargando...</div>

    <table *ngIf="!loading" border="1" cellpadding="6" style="width:100%;border-collapse:collapse;">
      <thead style="background:#f4f4f4;">
        <tr>
          <th>ID</th>
          <th>Clave</th>
          <th>Temperatura</th>
          <th>Alarma</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of registros">
          <td>{{ r.id }}</td>
          <td>{{ r.claveDinamica }}</td>
          <td>{{ r.temperatura }}</td>
          <td>{{ r.alarmaBuzzer }}</td>
          <td>{{ r.fecha_hora }}</td>
        </tr>
        <tr *ngIf="registros.length === 0">
          <td colspan="5" style="text-align:center;padding:1rem;">No hay registros</td>
        </tr>
      </tbody>
    </table>
  </div>
